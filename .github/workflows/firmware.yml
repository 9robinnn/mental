# SPDX-License-Identifier: GPL-3.0-only
# MENTAL: build the firmware with JieLi's toolchain on GitHub's Linux runner, run the host tests, build
# the browser preview and the site (installer + editor), and publish it to GitHub Pages.
# Settings > Pages: Source = GitHub Actions.
name: firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
          command -v wasm-ld >/dev/null || sudo ln -sf "$(ls /usr/bin/wasm-ld* | head -1)" /usr/local/bin/wasm-ld
      - name: JieLi toolchain and SDK (cached)
        id: jl
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Fetch them if not cached
        if: steps.jl.outputs.cache-hit != 'true'
        run: |
          try() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 15)); done; return 1; }
          [ -x ~/.jieli/toolchain/pi32v2/bin/clang ] || try tools/get_toolchain.sh
          fetch_sdk() {
            rm -rf ~/fw-AC79_AIoT_SDK
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
          }
          [ -f ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot ] || try fetch_sdk
      - name: Keep them for next time
        if: steps.jl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1
      - name: Version
        run: echo "V=0.$((GITHUB_RUN_NUMBER % 10))" >> "$GITHUB_ENV"
      - name: Build the firmware
        run: |
          set -o pipefail
          sh build.sh --release "$V" 2>&1 | tee build.log || {
            echo "::error title=build failed::$(tail -60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cp "build/felucca-$V.fwsc" build/felucca.fwsc   # the test runner looks for this name
          ls -la build/*.fwsc
      - name: Tests
        run: |
          set -o pipefail
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          sh tests/run_tests.sh 2>&1 | tee tests.log || {
            echo "::error title=tests failed::$( { grep -n "TEST STEP FAILED" tests.log; grep -nE "FAIL$|FAILED|OVER BUDGET|CHANGED |ASSERT|Sanitizer|Segmentation" tests.log | grep -v "0 failed\\|0 kits failed\\|timed: a note"; } | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Browser preview
        run: python3 tools/build_preview.py
      - name: Site (installer, editor, download)
        run: python3 web/make_site.py "build/felucca-$V.fwsc" "$V" build/pages
      - uses: actions/upload-artifact@v4
        with:
          name: mental-firmware-${{ env.V }}
          path: build/felucca-${{ env.V }}.fwsc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
